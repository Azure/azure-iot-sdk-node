name: $(BuildID)_$(BuildDefinitionName)_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)
resources:
  - repo: self
    clean: true

variables:
  # Direct access to public npm registries (registry.npmjs.org, etc.) is blocked on
  # Microsoft-managed devices/agents. Route npm/npx through the CFS-protected feed.
  # npm's default replace-registry-host=npmjs rewrites the registry.npmjs.org tarball
  # URLs already stored in package-lock.json, so the lockfiles need no changes.
  npm_config_registry: https://packagefeedproxy.microsoft.io/npm/
  # CodeQL is auto-injected into every job by the 1ES policy decorator. Off by
  # default here so the resource-provisioning and cleanup jobs stop producing
  # incidental databases -- S360 records arg_max(SnapshotDate) per
  # (repo, language), and the 'javascript' snapshot for this repo was being
  # attributed to the 'create_azure_resources' job. The 'Phase_2' job below opts
  # back in after the real npm/lerna build.
  # See https://aka.ms/codeql3000 and https://aka.ms/sdlfaqcodeql.
  Codeql.Enabled: false

stages:
- stage: setup
  jobs:
  - job: create_azure_resources
    pool:
      vmImage: 'ubuntu-24.04'
    steps:
    - script: |
        sudo apt-get install -y uuid
        # Cut first 28 characters of uuid to make a resource group name no longer than 46 characters.
        # deploy.sh fails if rgName is longer than 46 characters.
        AZURE_RESOURCE_GROUP="nodenightlylinux$(uuid | tr -d '-' | cut -c1-29)"

        # Export variables to other stages/jobs/steps.
        echo "##vso[task.setvariable variable=AZURE_RESOURCE_GROUP;isOutput=true]$AZURE_RESOURCE_GROUP"
      name: setResourceNames
      displayName: Set Resource Names

    - task: AzureCLI@2
      inputs:
        azureSubscription: 'iot hub sdk service connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e

          export AZURE_RESOURCE_GROUP=$(setResourceNames.AZURE_RESOURCE_GROUP)

          ./node_e2e_resources/deploy.sh -l "$AZURE_REGION" -n "$AZURE_RESOURCE_GROUP" -u
          find . -iname activate*
      displayName: Create Azure Resources
      name: createAzureResources
    - publish: ./destroy_deployment.sh
      artifact: cleanup-script
      displayName: Publish artifact (cleanup script)
      condition: always()
    - publish: ./node_e2e_resources/secrets/env/activate
      artifact: secretsEnv

- stage: build_and_tests
  jobs:
  - job: Phase_2
    displayName: Ubuntu 22.04 - Node 18.x
    condition: succeededOrFailed()
    variables:
      # Owns the 'javascript' CodeQL snapshot for this repo
      # (Microsoft.Security.CodeQL.10000). Overrides the pipeline-level
      # Codeql.Enabled: false. Only on main; PR builds need no snapshot.
      Codeql.Enabled: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
      Codeql.Language: javascript
    pool:
      vmImage: 'ubuntu-22.04'

    steps:
    - download: current
      artifact: secretsEnv

    - task: NodeTool@0
      displayName: 'Use Node 18.x'
      inputs:
        versionSpec: '18.x'

    - task: CodeQL3000Init@0
      displayName: 'Initialize CodeQL'

    - script: |
        npm install --global node-gyp
        npm install --ignore-scripts
      displayName: 'Install Dependencies'

    - script: |
          npx tsc --version
          npx lerna run build
      displayName: 'Build'

    # Finalize before the test steps so the snapshot is not hostage to flaky
    # integration/E2E runs; CodeQL only needs the sources and the built output.
    - task: CodeQL3000Finalize@0
      displayName: 'Finalize CodeQL'
      condition: always()

    - script: |
        set -e
        . $(Pipeline.Workspace)/secretsEnv/activate    # Set env vars defined in setup.
        npx lerna run ci
      displayName: 'Unit & Integration Tests'

    - script: |
        set -e
        . $(Pipeline.Workspace)/secretsEnv/activate    # Set env vars defined in setup.
        npx lerna run e2e
      displayName: 'E2E Tests'

    - task: PublishTestResults@2
      displayName: 'Publish Test Results | Mocha'
      inputs:
        testResultsFiles: '**/test-results.*.xml'
        mergeTestResults: true
        testRunTitle: 'E2E Tests - Linux'
      condition: succeededOrFailed()
- stage: cleanup
  dependsOn:
  - setup
  - build_and_tests
  condition: always() # Run stage even if the pipeline run is cancelled.
  jobs:
  - job: destroy_azure_resource_group
    condition: always() # Run job even if the pipeline run is cancelled.
    pool:
      vmImage: 'ubuntu-24.04'
    variables:
        AZURE_RESOURCE_GROUP: $[stageDependencies.setup.create_azure_resources.outputs['setResourceNames.AZURE_RESOURCE_GROUP']]
    steps:
    - download: current
      artifact: cleanup-script
      displayName: Download artifact (cleanup script)
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'iot hub sdk service connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          # set -e

          . "$(Pipeline.Workspace)/cleanup-script/destroy_deployment.sh"
      displayName: Destroy Azure Resource Group
      condition: always() # Run step even if the pipeline run is cancelled.