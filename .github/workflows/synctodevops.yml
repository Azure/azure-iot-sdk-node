  
name: Sync issue to Azure DevOps work item

"on":
  issues:
    types:
      [opened, reopened, closed, deleted, assigned, labeled, unlabeled]

permissions:
  id-token: write
  issues: write

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: danhellem/github-actions-issue-to-work-item@v2.5 # For security purposes, pin to a specific version rather than latest
        env:
          ado_token: "${{ secrets.ADO_PERSONAL_ACCESS_TOKEN }}"
          ado_organization: "${{ secrets.ADO_ORGANIZATION }}"
          ado_project: "${{ secrets.ADO_PROJECT }}"
          ado_area_path: "${{ secrets.ADO_AREA_PATH }}"
          ado_wit: "Bug"
          ado_new_state: "New"
          ado_active_state: "In Progress"
          ado_close_state: "Done"
          ado_bypassrules: false
          log_level: 300
